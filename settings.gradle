pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'Fusion Core'

include 'installer'
include 'i18n-config'

include 'fusioncore-common'

include 'fusioncore-forge'
include 'fusioncore-neoforge'
include 'fusioncore-fabric'

include 'bootstrap'
