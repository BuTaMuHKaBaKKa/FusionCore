# Fusion Core: Lithium/Radium mixin overrides.
# mixin.ai.poi.fast_portals - overwrites PortalForcer.findClosestPortalPosition, where Arclight
#                             applies the Bukkit portal search radius.
# Mechanism: https://github.com/CaffeineMC/lithium/wiki
["lithium:options"]
"mixin.ai.poi.fast_portals" = false
