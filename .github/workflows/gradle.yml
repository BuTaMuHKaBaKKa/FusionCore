# Fusion Core: builds the three jars on every push and keeps them as a workflow artifact.
# The first run also runs Spigot BuildTools (clones and compiles CraftBukkit); its result is cached in .gradle/arclight.

name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Cache Gradle user home
      uses: actions/cache@v4
      with:
        path: ~/.gradle
        key: ${{ runner.os }}-gradle-user-home-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-user-home-
    - name: Cache BuildTools output
      uses: actions/cache@v4
      with:
        path: ./.gradle
        key: ${{ runner.os }}-gradle-project-${{ hashFiles('buildSrc/**', 'gradle.properties') }}
        restore-keys: ${{ runner.os }}-gradle-project-
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build
      run: ./gradlew cleanBuild build collect --no-daemon --stacktrace
    - name: Upload jars
      uses: actions/upload-artifact@v4
      with:
        name: Fusion Core
        path: ./build/libs/*.jar
