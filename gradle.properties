org.gradle.jvmargs=-Xmx4g -Dfile.encoding=utf-8

# Gradle's default HTTP timeouts are 30s. Resolving Minecraft-ecosystem artifacts
# crosses several third-party repositories, and one slow response there fails the
# whole build rather than moving on to the next repository.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=180000
