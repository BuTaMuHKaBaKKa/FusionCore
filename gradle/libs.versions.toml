[versions]
# plugins
architectury-loom = '1.9-SNAPSHOT'
# architectury-plugin, gradleup-shadow version: ../build.gradle

# common
lombok = '1.18.38'
jetbrains-annotations = '23.0.0'

asm = '9.7.1'
commons-io = '2.19.0'
gson = '2.10.1'
hocon = '3.6.1'

lorenz = '0.5.8'
lorenz-io-proguard = '0.5.8'
fabric-lorenz-tiny = '4.0.2'
cadixdev-at = '0.1.0-rc1'
cadixdev-mercury = '0.1.4.17'
special-source = '1.11.5'

mixin = '0.8.5'

# Fusion Core: Adventure, so plugins built against Paper find it at runtime.
# Keep in step with the Adventure that Paper ships for this Minecraft version.
adventure = '4.17.0'
kyori-examination = '1.3.0'
# option 1.1.0 is a strict superset of the 1.0.0 that Adventure 4.17 names; plugins that bundle 1.1.0 unrelocated (DecentHolograms)
# would otherwise mix both versions in one package and fail with IllegalAccessError
kyori-option = '1.1.0'

# arclight
arclight-api = '1.7.3'
izzel-tools = '1.3.0'
mixin-tools = '1.2.6'

# minecraft, loaders dependencies (CHECK when migrating Minecraft Versions)
minecraft = '1.21.1'
parchment = '2024.11.17'
forge = '52.1.16'
full-forge = '1.21.1-52.1.14'
# Pinned deliberately, do not bump without re-testing on NeoForge.
# Loom puts the mixin implementation that fabric-loader names in its
# fabric-installer.json on the compile classpath for every module, including
# fusioncore-common. fabric-loader >= 0.19 selects sponge-mixin 0.17.x, which
# redeclared @Redirect.at() as At[] instead of At. Everything compiled against it
# gets an array-valued `at`, and NeoForge's own mixin (sponge-mixin 0.15.2) plus
# MixinExtras read it as a single annotation:
#   ClassCastException: java.util.ArrayList cannot be cast to
#   org.objectweb.asm.tree.AnnotationNode
#   at FactoryRedirectWrapperMixinTransformer.transform
# The server then dies during mixin apply, before world load. fabric-loader 0.18.2
# is the last version that names sponge-mixin 0.16.5, which still declares At at().
fabric-loader = '0.18.2'
fabric-api = '0.116.7+1.21.1'
neoforge = '21.1.250'
fabric-permissions-api = '0.3.1'

# spigot dependencies (CHECK when migrating Spigot Versions)
spigot-reversion = '4344'
bukkit-api = 'v1_21_R1'
spigot-api = '1.21.1-R0.1-SNAPSHOT'
bungeecord-chat-api = '1.20-R0.2'
jline = '2.12.1'
terminal-console-appender = '1.2.0'
log4j = '2.22.1'
snakeyaml = '2.0'
mysql-connector-j = '8.4.0'


[libraries]
# common
lombok = { module = 'org.projectlombok:lombok', version.ref = 'lombok' }
jetbrains-annotations = { module = 'org.jetbrains:annotations', version.ref = 'jetbrains-annotations' }

# buildSrc
loom = { module = 'dev.architectury:architectury-loom', version.ref = 'architectury-loom' }

asm-commons = { module = 'org.ow2.asm:asm-commons', version.ref = 'asm' }
asm-tree = { module = 'org.ow2.asm:asm-tree', version.ref = 'asm' }
asm-util = { module = 'org.ow2.asm:asm-util', version.ref = 'asm' }
commons-io = { module = 'commons-io:commons-io', version.ref = 'commons-io' }

lorenz-core = { module = 'org.cadixdev:lorenz', version.ref = 'lorenz' }
lorenz-proguard = { module = 'org.cadixdev:lorenz-io-proguard', version.ref = 'lorenz-io-proguard' }
lorenz-tiny = { module = 'net.fabricmc:lorenz-tiny', version.ref = 'fabric-lorenz-tiny' }
at = { module = 'org.cadixdev:at', version.ref = 'cadixdev-at' }
mercury = { module = 'dev.architectury:mercury', version.ref = 'cadixdev-mercury' }
specialsource = { module = 'net.md-5:SpecialSource', version.ref = 'special-source' }

# subProjects (fusioncore-common, and other in platforms)
minecraft = { module = 'com.mojang:minecraft', version.ref = 'minecraft' }
spigot-api = { module = 'org.spigotmc:spigot-api', version.ref = 'spigot-api' }
bungeecord-chat = { module = 'net.md-5:bungeecord-chat', version.ref = 'bungeecord-chat-api' }
snakeyaml = { module = 'org.yaml:snakeyaml', version.ref = 'snakeyaml' }
mysql-connectorj = { module = 'com.mysql:mysql-connector-j', version.ref = 'mysql-connector-j' }
jline = { module = 'jline:jline', version.ref = 'jline' }
terminalconsoleappender = { module = 'net.minecrell:terminalconsoleappender', version.ref = 'terminal-console-appender' }
log4j-api = { module = 'org.apache.logging.log4j:log4j-api', version.ref = 'log4j' }
log4j-core = { module = 'org.apache.logging.log4j:log4j-core', version.ref = 'log4j' }
log4j-jul = { module = 'org.apache.logging.log4j:log4j-jul', version.ref = 'log4j' }

arclight-api = { module = 'io.izzel.arclight:arclight-api', version.ref = 'arclight-api' }
izzel-tools = { module = 'io.izzel:tools', version.ref = 'izzel-tools' }
mixin-tools = { module = 'io.izzel.arclight:mixin-tools', version.ref = 'mixin-tools' }

# platforms (fusioncore-forge, fusioncore-fabric, fusioncore-neoforge)
forge = { module = 'net.minecraftforge:forge', version.ref = 'full-forge' }
fabric-loader = { module = 'net.fabricmc:fabric-loader', version.ref = 'fabric-loader' }
fabric-api = { module = 'net.fabricmc.fabric-api:fabric-api', version.ref = 'fabric-api' }
fabric-permissions-api = { module ='me.lucko:fabric-permissions-api', version.ref = 'fabric-permissions-api' }
neoforge = { module ='net.neoforged:neoforge', version.ref = 'neoforge' }

# installer
gson = { module = 'com.google.code.gson:gson', version.ref = 'gson' }

# i18n-config
configurate-hocon = { module = 'org.spongepowered:configurate-hocon', version.ref = 'hocon' }

# bootstrap
sponge-mixin = { module = 'org.spongepowered:mixin', version.ref = 'mixin' }

# adventure (Fusion Core)
adventure-api = { module = 'net.kyori:adventure-api', version.ref = 'adventure' }
adventure-key = { module = 'net.kyori:adventure-key', version.ref = 'adventure' }
adventure-nbt = { module = 'net.kyori:adventure-nbt', version.ref = 'adventure' }
adventure-serializer-gson = { module = 'net.kyori:adventure-text-serializer-gson', version.ref = 'adventure' }
adventure-serializer-json = { module = 'net.kyori:adventure-text-serializer-json', version.ref = 'adventure' }
adventure-serializer-legacy = { module = 'net.kyori:adventure-text-serializer-legacy', version.ref = 'adventure' }
adventure-serializer-plain = { module = 'net.kyori:adventure-text-serializer-plain', version.ref = 'adventure' }
adventure-minimessage = { module = 'net.kyori:adventure-text-minimessage', version.ref = 'adventure' }
adventure-logger-slf4j = { module = 'net.kyori:adventure-text-logger-slf4j', version.ref = 'adventure' }
kyori-examination-api = { module = 'net.kyori:examination-api', version.ref = 'kyori-examination' }
kyori-examination-string = { module = 'net.kyori:examination-string', version.ref = 'kyori-examination' }
kyori-option = { module = 'net.kyori:option', version.ref = 'kyori-option' }

[bundles]
asm = ['asm-commons', 'asm-tree', 'asm-util']
lorenz = ['lorenz-core', 'lorenz-proguard', 'lorenz-tiny']
log4j = ['log4j-api', 'log4j-core', 'log4j-jul']
spigot-shade = ['spigot-api', 'bungeecord-chat']
adventure = ['adventure-api', 'adventure-key', 'adventure-nbt', 'adventure-serializer-gson',
             'adventure-serializer-json', 'adventure-serializer-legacy', 'adventure-serializer-plain',
             'adventure-minimessage', 'adventure-logger-slf4j', 'kyori-examination-api', 'kyori-examination-string', 'kyori-option']
spigot-runtime = ['spigot-api', 'snakeyaml', 'mysql-connectorj', 'bungeecord-chat']
