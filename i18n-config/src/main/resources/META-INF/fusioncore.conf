_v = 1

locale {
  fallback = "en_us"
}
optimization {
  cache-plugin-class = true
  disable-data-fixer = false
  goal-selector-update-interval = 2
  use-activation-and-tracking-range = true
}
compatibility {
  material-property-overrides {
  }
  entity-property-overrides {
  }
  symlink-world = false
  extra-logic-worlds = [
    "com.example.mod.ExtraLogicWorld",
    "xyz.nucleoid.fantasy.RuntimeWorld"
  ]
  forward-permission = true
  valid-username-regex = ""
  isolate-plugin-class-loaders = [
    "com.example.mod.package.aaaa"
  ]
  isolate-adventure-from-modloader = false
}
async-catcher {
  dump = true
  warn = true
  defaultOperation = block
  overrides {
  }
}
velocity {
  enable = false
  secret = ""
}
experimental {
  replaceable-base-world-generator = false
}
lootables {
  auto-replenish = false
  restrict-player-reloot = true
  restrict-player-reloot-time = "disabled"
  reset-seed-on-fill = true
  max-refills = -1
  refresh-min = "12h"
  refresh-max = "2d"
  retain-unlooted-shulker-box-loot-table-on-non-player-break = true
}
machines {
  owner-events = true
  unknown-owner = "allow"
  ignored-mods = []
}
