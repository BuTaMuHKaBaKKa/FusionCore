_v = 1

locale {
  fallback = "en_us"
}
optimization {
  cache-plugin-class = true
  disable-data-fixer = false
  goal-selector-update-interval = 2
  use-activation-and-tracking-range = true
  explosion-exposure-samples = 16
  dab {
    enabled = false
    start-distance = 12.0
    max-tick-freq = 20
    activation-dist-mod = 8
    dont-enable-if-in-water = false
    blacklisted-entities = [
      "villager"
      "axolotl"
      "hoglin"
      "zombified_piglin"
      "goat"
    ]
  }
  throttle-mob-spawning {
    enabled = false
    categories {
      monster {
        min-failed = 8
        spawn-chance = 25.0
      }
      creature {
        min-failed = 8
        spawn-chance = 25.0
      }
      ambient {
        min-failed = 8
        spawn-chance = 25.0
      }
      axolotls {
        min-failed = 8
        spawn-chance = 25.0
      }
      underground_water_creature {
        min-failed = 8
        spawn-chance = 25.0
      }
      water_creature {
        min-failed = 8
        spawn-chance = 25.0
      }
      water_ambient {
        min-failed = 8
        spawn-chance = 25.0
      }
    }
  }
  only-tick-items-in-hand = false
  reduce-entity-move-packets = false
  async-playerdata-save = false
  villager-lobotomize {
    enabled = false
    check-interval = 100
    wait-until-trade-locked = false
  }
  optimize-mob-despawn = false
  tracker-nearby-players = false
  lagging-threshold = 19.0
  zombie-aggressive-towards-villager-when-lagging = true
}
compatibility {
  material-property-overrides {
  }
  entity-property-overrides {
  }
  symlink-world = false
  extra-logic-worlds = [
    "com.example.mod.ExtraLogicWorld",
    "xyz.nucleoid.fantasy.RuntimeWorld"
  ]
  forward-permission = true
  valid-username-regex = ""
  isolate-plugin-class-loaders = [
    "com.example.mod.package.aaaa"
  ]
  isolate-adventure-from-modloader = false
}
async-catcher {
  dump = true
  warn = true
  defaultOperation = block
  overrides {
  }
}
velocity {
  enable = false
  secret = ""
}
spam-limiter {
  tab-spam-increment = 1
  tab-spam-limit = 500
  tab-complete-max-pending = 16
}
tpsbar {
  enabled = true
  tick-interval = 20
  title = "<gray>TPS<yellow>:</yellow> <tps>  MSPT<yellow>:</yellow> <mspt><gray>/50</gray>  Ping<yellow>:</yellow> <ping>ms"
  overlay = NOTCHED_20
  fill-mode = MSPT
  progress-color {
    good = GREEN
    medium = YELLOW
    low = RED
  }
  text-color {
    good = "<gradient:#55ff55:#00aa00><text></gradient>"
    medium = "<gradient:#ffff55:#ffaa00><text></gradient>"
    low = "<gradient:#ff5555:#aa0000><text></gradient>"
  }
  thresholds {
    tps-good = 19
    tps-medium = 15
    mspt-good = 40
    mspt-medium = 50
    ping-good = 100
    ping-medium = 200
  }
}
experimental {
  replaceable-base-world-generator = false
}
lootables {
  auto-replenish = false
  restrict-player-reloot = true
  restrict-player-reloot-time = "disabled"
  reset-seed-on-fill = true
  max-refills = -1
  refresh-min = "12h"
  refresh-max = "2d"
  retain-unlooted-shulker-box-loot-table-on-non-player-break = true
}
machines {
  owner-events = true
  unknown-owner = "allow"
  ignored-mods = [
    "examplemod"
  ]
}
world {
  chunks {
    entity-per-chunk-save-limit {
      area_effect_cloud = -1
      arrow = -1
      dragon_fireball = -1
      egg = -1
      ender_pearl = -1
      experience_orb = -1
      eye_of_ender = -1
      fireball = -1
      firework_rocket = -1
      llama_spit = -1
      potion = -1
      shulker_bullet = -1
      small_fireball = -1
      snowball = -1
      spectral_arrow = -1
      trident = -1
      wither_skull = -1
    }
    prevent-moving-into-unloaded-chunks = false
    max-auto-save-chunks-per-tick = 24
  }
  collisions {
    max-entity-collisions = 8
  }
  hopper {
    ignore-occluding-blocks = false
  }
  tick-rates {
    grass-spread = 1
    container-update = 1
    mob-spawner = 1
    wet-farmland = 1
    dry-farmland = 1
    sensor {
      villager {
        secondarypoisensor = 40
      }
    }
    behavior {
      villager {
        validatenearbypoi = -1
      }
    }
  }
  feature-seeds {
    generate-random-seeds-for-all = false
  }
  unsupported-settings {
    allow-headless-pistons = false
  }
  armorstand {
    place-with-arms-visible = false
    tick = true
    minecart-collision-lookups = true
  }
  maps {
    item-frame-cursor-update-interval = 10
  }
  idle-timeout {
    kick-if-idle = true
    tick-nearby-entities = true
    mobs-target = true
  }
  worlds {
    example_world_nether {
      tick-rates {
        grass-spread = 1
      }
    }
  }
}
anti-xray {
  enabled = false
  engine-mode = 1
  max-block-height = 64
  update-radius = 2
  lava-obscures = false
  use-permission = false
  hidden-blocks = [
    "copper_ore"
    "deepslate_copper_ore"
    "raw_copper_block"
    "gold_ore"
    "deepslate_gold_ore"
    "iron_ore"
    "deepslate_iron_ore"
    "raw_iron_block"
    "coal_ore"
    "deepslate_coal_ore"
    "lapis_ore"
    "deepslate_lapis_ore"
    "mossy_cobblestone"
    "obsidian"
    "chest"
    "diamond_ore"
    "deepslate_diamond_ore"
    "redstone_ore"
    "deepslate_redstone_ore"
    "clay"
    "emerald_ore"
    "deepslate_emerald_ore"
    "ender_chest"
  ]
  replacement-blocks = [
    "stone"
    "oak_planks"
    "deepslate"
  ]
  worlds {
    example_world_nether {
      enabled = false
    }
  }
}
