 comments {
  _v.comment = [
    "Основано на Arclight: https://github.com/IzzelAliz/Arclight"
    ""
    ""
    "Версия конфигурации, не исправляйте."
  ]
  locale.comment = "Язык/настройки I18n"
  optimization {
    comment = "Настройки серверных оптимизаций"
    disable-data-fixer.comment = [
      "Отключить систему DataFixerUpper, ответственную за перенос данных мира из старых версий Minecraft"
      "Может ускорить запуск, загрузку мира и снизить потребление памяти на 80-200mb"
      "Fusion Core и его разработчики не несут ответственности за потерю или порчу данных"
      "НЕ ИСПОЛЬЗУЙТЕ НА ХОДОВОМ СЕРВЕРЕ!"
    ]
    explosion-exposure-samples.comment = [
      "Fusion Core: сколько точек по каждой оси взрыв проверяет, чтобы понять, насколько сущность открыта (в ванили - две на блок размера)"
      "  Огромные сущности (контрапции Create, физические постройки) без ограничения стоят сотни тысяч лучей на каждый взрыв;"
      "  ванильные мобы меньше порога 16 и не затрагиваются. Ответ для сущности переиспользуется, пока идёт тот же взрыв"
      "  (если мод спрашивает дважды). 1 считается как 2. 0 - как в ванили"
    ]
    dab {
      comment = [
        "Fusion Core: Dynamic Activation of Brain из Pufferfish (у Leaf - performance.dab). Мозг моба вдали от игроков"
        "  работает раз в несколько тиков: раз в (расстояние^2 / 2^activation-dist-mod) тиков, но не реже max-tick-freq."
        "  Действует на всех мобов с мозгом, из модов тоже. Нужно use-activation-and-tracking-range = true."
      ]
      start-distance.comment = "Мобов ближе этого расстояния к игроку не трогает."
      max-tick-freq.comment = "Мозг самых дальних мобов работает раз в столько тиков (20 - раз в секунду)."
      activation-dist-mod.comment = "Меньше - дальние мобы думают реже (7), больше - чаще (9)."
      dont-enable-if-in-water.comment = "Мобов, которые не дышат под водой, в воде не трогает (иначе тонут)."
      blacklisted-entities.comment = "id сущностей, которых не трогает никогда."
    }
    throttle-mob-spawning.comment = [
      "Fusion Core: throttle-mob-spawning из Leaf. Чанк, где естественный спавн категории не удался min-failed раз подряд,"
      "  пробует дальше только с вероятностью spawn-chance процентов; удача сбрасывает счёт. min-failed = -1 - выключено."
    ]
    only-tick-items-in-hand.comment = [
      "Fusion Core: only-tick-items-in-hand из Leaf. Тик в инвентаре получает только предмет в руке, обновления карт - только"
      "  предметы в руках. Быстрее при полных инвентарях, но карты, компасы и предметы модов (броня, рюкзаки, заряжаемые"
      "  инструменты) в остальных слотах перестают обновляться. Проверьте моды, прежде чем включать."
    ]
    reduce-entity-move-packets.comment = [
      "Fusion Core: reduce-entity-move-packets из Leaf. Не слать периодический пакет позиции сущности, которая не сдвинулась."
    ]
    async-playerdata-save.comment = [
      "Fusion Core: писать файлы игроков на диск в фоне (у Leaf - async-playerdata-save, здесь безопасно). Данные игрока и модов"
      "  по-прежнему собираются в главном потоке, в фон уходит только запись. Загрузка игрока ждёт его записи, остановка"
      "  сервера - всех записей."
    ]
    villager-lobotomize {
      comment = [
        "Fusion Core: mobs.villager.lobotomize из Purpur. Житель, которому некуда шагнуть (торговые залы), не думает;"
        "  сделки при этом пополняет."
      ]
      check-interval.comment = "Как часто проверять жителя, в тиках."
      wait-until-trade-locked.comment = "Не трогать жителей, с которыми ещё не торговали (нет опыта)."
    }
    optimize-mob-despawn.comment = [
      "Fusion Core: optimize-mob-despawn из Leaf, безопасный вариант. Мобы деспавнятся своим кодом (событие деспавна"
      "  NeoForge, мобы из модов); быстрее только поиск ближайшего игрока - по снимку игроков раз в тик. Полезно при"
      "  большом онлайне; результат тот же."
    ]
    tracker-nearby-players.comment = [
      "Fusion Core: безопасная часть async-entity-tracker из Leaf, без потоков (поиск ближних игроков как у Paper). Сущность,"
      "  перешедшая в другую секцию, проверяется только против игроков в чанках в пределах её дальности слежения и тех, кто"
      "  её уже видит, а не против всех игроков мира. Результат тот же; полезно от нескольких десятков игроков (включается,"
      "  когда в мире 8 игроков и больше)."
    ]
    lagging-threshold.comment = [
      "Fusion Core: settings.lagging-threshold из Purpur. Сервер считается лагающим, пока его TPS за последнюю минуту"
      "  ниже этого значения (нужно опции ниже)."
    ]
    zombie-aggressive-towards-villager-when-lagging.comment = [
      "Fusion Core: mobs.zombie.aggressive-towards-villager-when-lagging из Purpur. false - зомби, утопленники и их родня"
      "  (в том числе из модов) не охотятся на жителей, пока сервер лагает. Совсем выключает охоту"
      "  zombie-aggressive-towards-villager в spigot.yml."
    ]
  }
  async-catcher.comment = [
    «Настройки Async Catcher»
    «Есть четыре режима, BLOCK наиболее предпочтителен»
    «NONE - Ничего не предпринимать»
    «DISPATCH - Действовать в основном потоке без его блокировки»
    «BLOCK - Перехватывать основной поток и ожидать результат»
    «EXCEPTION - Выдавать исключение»
  ]
  async-catcher.dump.comment = "Сохранять трассировку стека в debug.log"
  spam-limiter {
    comment = "Fusion Core: ограничение спама подсказками команд (Tab) из Paper, умолчания как у Paper."
    tab-spam-increment.comment = "Сколько добавляется к счётчику игрока за каждый запрос подсказок; каждый тик счётчик уменьшается на 1."
    tab-spam-limit.comment = "Игрока (не оператора), чей счётчик выше этого значения, кикает за спам."
    tab-complete-max-pending.comment = [
      "Когда плагин слушает AsyncTabCompleteEvent, столько запросов одного игрока может ждать его ответа;"
      "  следующие остаются без подсказок, пока те не обработаны."
    ]
  }
  tpsbar {
    comment = "Fusion Core: /tpsbar из Purpur, боссбар с TPS, MSPT и пингом (право purpur.command.tpsbar, у операторов)."
    enabled.comment = "false - команды /tpsbar нет (её может дать плагин)."
    tick-interval.comment = "Раз во сколько тиков обновлять бары; TPS и MSPT те же, что показывает /tps (getTPS / getAverageTickTime из Paper)."
    title.comment = "Текст бара в MiniMessage; плейсхолдеры <tps> <mspt> <ping>, каждый в цвете из text-color."
    overlay.comment = "PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12 или NOTCHED_20."
    fill-mode.comment = "Чем заполняется бар и по чему выбирается его цвет: MSPT (из 50), TPS (из 20) или PING (из ping-medium)."
    progress-color.comment = "Цвет бара по уровню: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE."
    text-color.comment = "MiniMessage вокруг значения по уровню; <text> - само значение."
    thresholds.comment = [
      "Уровни: TPS не ниже tps-good - хорошо, не ниже tps-medium - средне; MSPT ниже mspt-good - хорошо, ниже"
      "  mspt-medium - средне; пинг ниже ping-good - хорошо, ниже ping-medium - средне; остальное - плохо."
    ]
  }
  world {
    comment = [
      "Fusion Core: настройки миров Paper (config/paper-world-defaults.yml), которые выполняет ядро; worlds - свои значения для отдельного мира."
      "Ключи и умолчания - как у Paper; значения можно перенести с сервера на Paper/Purpur/Leaf."
    ]
    chunks {
      entity-per-chunk-save-limit.comment = [
        "Сколько сущностей одного типа чанк сохраняет и загружает, лишние пропадают. -1 - без ограничения."
        "Ключи - id сущностей (\"arrow\", \"minecraft:arrow\", id из модов тоже)."
      ]
      prevent-moving-into-unloaded-chunks.comment = [
        "Игрок (и транспорт, которым он управляет) не может зайти в незагруженные чанки - его возвращает на место."
      ]
      max-auto-save-chunks-per-tick.comment = [
        "Автосохранение сохраняет не больше стольких чанков за тик, а не все загруженные чанки разом (нет скачка лага"
        "  при каждом автосохранении). /save-all и остановка сервера по-прежнему сохраняют всё сразу. 0 - всё сразу, как в ванили."
      ]
    }
    collisions {
      max-entity-collisions.comment = [
        "Сколько раз за тик сущность может толкать и быть толкнутой; толпы мобов стоят намного дешевле. 0 - толкания нет."
      ]
    }
    hopper {
      ignore-occluding-blocks.comment = [
        "Воронки не ищут вагонетки и лодки с сундуком внутри полных (непрозрачных) блоков."
      ]
    }
    tick-rates {
      comment = "1 - как в ванили. Значение N - раз в N тиков."
      grass-spread.comment = "Случайные тики травы (распространение и отмирание) раз в N тиков; меньше 1 - никогда."
      container-update.comment = "Открытое меню отправляет игроку изменения раз в N тиков."
      mob-spawner.comment = "Спавнеры работают раз в N тиков и уменьшают задержку сразу на N; -1 выключает спавнеры."
      wet-farmland.comment = "Случайные тики влажной грядки раз в N тиков; меньше 1 - никогда."
      dry-farmland.comment = "Случайные тики сухой грядки раз в N тиков; меньше 1 - никогда."
      sensor.comment = [
        "Тиков между проверками сенсора: id сущности -> имя класса сенсора маленькими буквами -> тики."
      ]
      behavior.comment = [
        "Сколько тиков поведение ждёт после окончания: id сущности -> имя класса поведения маленькими буквами -> тики; -1 - как в ванили."
      ]
    }
    feature-seeds {
      generate-random-seeds-for-all.comment = [
        "Дать каждой фиче генерации (руды, деревья, озёра..., из модов тоже) в каждом мире свой случайный сид, чтобы"
        "  сид-крекеры не находили руды. Меняются только новые чанки. Сиды хранятся в fusioncore-feature-seeds.json в папке"
        "  мира (измерение -> id фичи -> сид); вписанные туда руками сиды работают и при false."
      ]
    }
    unsupported-settings {
      allow-headless-pistons.comment = [
        "Paper: false - взрыв, уничтоживший движущийся поршень, уничтожает и сам поршень, безголовых поршней не остаётся"
        "  (ими ломают бедрок). true - как в ванили."
      ]
    }
    armorstand {
      place-with-arms-visible.comment = "Purpur: стойки для брони ставятся сразу с руками."
      tick.comment = [
        "Paper: false - стойки для брони не тикают (не падают, не горят, не толкаются; поза и экипировка обновляются)."
        "  Собственная настройка стойки (setCanTick, сохраняется как Paper.CanTickOverride) важнее. Только для декоративных стоек."
      ]
      minecart-collision-lookups.comment = "Paper (часть про вагонетки): false - стойки не ищут каждый тик вагонетки, чтобы толкнуть."
    }
    maps {
      item-frame-cursor-update-interval.comment = [
        "Paper: раз во сколько тиков отправлять обновление карты (картинка и курсоры) в рамке. 10 - как в ванили; больше -"
        "  дешевле при множестве карт в рамках, но обновляется медленнее; 0 и меньше - карты в рамках не обновляются."
      ]
    }
    idle-timeout {
      comment = [
        "AFK из Purpur: игрок, бездействующий дольше player-idle-timeout (server.properties, минуты; 0 - никогда), считается AFK."
        "  Любое действие, переход на другой блок или поворот головы снимают AFK."
      ]
      kick-if-idle.comment = "true - кикать бездействующего, как в ванили (кроме права purpur.bypassIdleKick); false - только отметить AFK."
      tick-nearby-entities.comment = "false - AFK-игрок не держит активными сущности вокруг себя (entity activation range)."
      mobs-target.comment = "false - мобы не нападают на AFK-игроков."
    }
    worlds.comment = [
      "Настройки одного мира по имени (world, world_nether, world_the_end; DIM-1 и DIM1 при ванильной раскладке); любой ключ этого"
      "  раздела, остальное берётся сверху (таблицы вроде entity-per-chunk-save-limit сливаются). У Paper это"
      "  world*/paper-world.yml. unsupported-settings у Paper общий, здесь тоже читается по мирам."
    ]
  }
  anti-xray {
    comment = [
      "Fusion Core: Anti-Xray из Paper (anticheat.anti-xray в paper-world-defaults.yml), те же ключи и умолчания."
      "  Руды и другие скрытые блоки, не касающиеся воздуха, игрок видит камнем (engine-mode 1) или вперемешку с поддельными"
      "  рудами (engine-mode 2 и 3); настоящие блоки открываются, когда рядом ломают или копают. id блоков модов тоже подходят."
    ]
    engine-mode.comment = "1 - прятать: скрытые блоки выглядят камнем/глубинным сланцем/незераком/эндерняком; 2 - любой блок-замена может выглядеть любым скрытым; 3 - как 2, один случайный блок на слой."
    max-block-height.comment = "Выше этой высоты блоки отправляются как есть (округляется вниз до кратного 16)."
    update-radius.comment = "На каком расстоянии от сломанного или копаемого блока открывать скрытые (1 или 2)."
    lava-obscures.comment = "Считать стоячую лаву твёрдым блоком, который прячет руды."
    use-permission.comment = "Игроки с правом paper.antixray.bypass видят настоящие блоки."
    hidden-blocks.comment = "Какие блоки прятать (режим 1) или показывать подделками (режимы 2 и 3)."
    replacement-blocks.comment = "Режимы 2 и 3: какие блоки могут заменяться поддельными скрытыми."
    worlds.comment = [
      "Настройки одного мира по имени (world, world_nether, world_the_end; DIM-1 и DIM1 при ванильной раскладке); любой ключ выше,"
      "  остальные берутся сверху. У Paper это world*/paper-world.yml."
    ]
  }
}
