comments {
  _v.comment = [
    "Based on Arclight: https://github.com/IzzelAliz/Arclight"
    ""
    ""
    "Config version number, do not edit."
  ]
  locale.comment = "Language/I18n settings"
  optimization {
    comment = "Optimization related settings"
    goal-selector-update-interval.comment = [
      "Interval in ticks to update the goal selector"
      "Higher values costs less resources"
      "Cause mobs changing their goals less often"
    ]
    use-activation-and-tracking-range.comment = "Whether to use Spigot Activation Range and Tracking Range optimization"
    explosion-exposure-samples.comment = [
      "Fusion Core: how many points per axis an explosion checks to see how exposed an entity is (vanilla: two per block of size)"
      "  Huge entities (Create contraptions, physics constructs) cost hundreds of thousands of ray casts per explosion without a cap;"
      "  vanilla mobs are below the default of 16 and are not affected. An entity's result is reused while the same explosion runs"
      "  (a mod asking twice). 1 counts as 2. 0 - vanilla"
    ]
    dab {
      comment = [
        "Fusion Core: Pufferfish's Dynamic Activation of Brain (Leaf: performance.dab). The brain of a mob far from players"
        "  runs only every few ticks: every (distance^2 / 2^activation-dist-mod) ticks, at most max-tick-freq."
        "  Works for every mob with a brain, modded ones too. Needs use-activation-and-tracking-range = true."
      ]
      start-distance.comment = "Mobs closer than this to a player are not throttled."
      max-tick-freq.comment = "The brain of the farthest mobs runs every this many ticks (20 = once a second)."
      activation-dist-mod.comment = "Lower - far mobs tick less often (7), higher - more often (9)."
      dont-enable-if-in-water.comment = "Mobs that cannot breathe under water are not throttled while in water (they would drown)."
      blacklisted-entities.comment = "Entity ids that are never throttled."
    }
    throttle-mob-spawning.comment = [
      "Fusion Core: Leaf's performance.throttle-mob-spawning. A chunk where natural spawning of a category failed min-failed"
      "  times in a row tries again only with spawn-chance percent; a success resets the count. -1 for min-failed - off."
    ]
    only-tick-items-in-hand.comment = [
      "Fusion Core: Leaf's only-tick-items-in-hand. Only the selected item gets its inventory tick and only items in the hands"
      "  get map updates. Faster with full inventories, but maps, compasses and modded items (armor, backpacks, tools that"
      "  charge in the inventory) elsewhere stop updating. Check your mods before turning it on."
    ]
    reduce-entity-move-packets.comment = [
      "Fusion Core: Leaf's reduce-entity-move-packets. Skip the periodic position packet of an entity that did not move."
    ]
    async-playerdata-save.comment = [
      "Fusion Core: write player data files in the background (Leaf: async-playerdata-save, done safely). The data, with what"
      "  mods add, is still collected on the server thread; only the disk write moves. Loading a player waits for its write,"
      "  and the server waits for all writes when it stops."
    ]
    villager-lobotomize {
      comment = [
        "Fusion Core: Purpur's mobs.villager.lobotomize. A villager that cannot walk to any side (trading halls) keeps its"
        "  brain off; it still restocks its trades."
      ]
      check-interval.comment = "How often, in ticks, a villager is checked."
      wait-until-trade-locked.comment = "Leave villagers that have not traded yet (no experience) alone."
    }
    optimize-mob-despawn.comment = [
      "Fusion Core: Leaf's optimize-mob-despawn, done safely. Mobs keep their own despawn code (NeoForge's despawn event,"
      "  modded mobs); only the search for the nearest player uses one snapshot of the players per tick. Helps with many"
      "  players online; the result is the same."
    ]
    tracker-nearby-players.comment = [
      "Fusion Core: the safe part of Leaf's async-entity-tracker, without threads (Paper's nearby-player lookup). An entity"
      "  that moved to another section is checked against the players in the chunks within its tracking range, plus those"
      "  that see it now, instead of every player of the world. Same result; helps from a few dozen players on (it is"
      "  used with 8 or more players in a world)."
    ]
    lagging-threshold.comment = [
      "Fusion Core: Purpur's settings.lagging-threshold. The server counts as lagging while its TPS over the last minute is"
      "  below this value (used by the option below)."
    ]
    zombie-aggressive-towards-villager-when-lagging.comment = [
      "Fusion Core: Purpur's mobs.zombie.aggressive-towards-villager-when-lagging. false - zombies, drowned and their kin"
      "  (modded ones too) do not hunt villagers while the server lags. spigot.yml zombie-aggressive-towards-villager"
      "  turns the hunting off for good."
    ]
  }
  async-catcher.comment = [
    "Async Catcher related settings"
    "There are four modes, and BLOCK is recommended"
    "NONE - Do nothing"
    "DISPATCH - Non blocking-ly dispatch action to main thread"
    "BLOCK - Run in main thread and wait for results"
    "EXCEPTION - Raise an error"
  ]
  async-catcher.dump.comment = "Dump stack trace information in debug.log"
  compatibility {
    symlink-world.comment = [
      "Create symbol links to mod dimension folder that matches Bukkit world name"
      "Enable this could improve plugin compatibility"
      "Changing this on production server will cause changes to mod world names"
      "  and cause data loss on plugins relying world names"
      "Fusion Core enables it on a new server (first start without a world), so the nether and end are world_nether and world_the_end as on Paper"
      "See https://github.com/IzzelAliz/Arclight/wiki/World-Symlink for more detail"
    ]
    extra-logic-worlds.comment = [
      "Extra worlds running logic"
      "If any mods do not function well, try search class names in logs/debug.log related to [EXT_LOGIC] and add them here"
    ]
    forward-permission.comment = [
      "true - Forward Forge permission query to Bukkit"
      "false - Disable permission forward"
      "reverse - Forward Bukkit player permission query to Forge"
    ]
    valid-username-regex.comment = [
      "Regex for valid username check. Leave it blank will fallback to vanilla check"
      "Following allows Chinese characters:"
      "valid-username-regex = \"^[ -~\\\\p{sc=Han}]{1,16}$\""
      "Following allows any username to login:"
      "valid-username-regex = \".+\""
    ]
    #exact-plugin-entity-damage-control.comment = [
    #  "Let plugin or mod controls the final entity damage"
    #  "When set to true, mod added damage will potentially be overridden by plugins"
    #]
    isolate-plugin-class-loaders.comment = [
      "An illegal access means that a plugin loads a class from another plugin that is not a depend or soft-depend of itself"
      "When a package name is given, no illegal access will be attempted on classes prefixed with the package name."
      "This is especially useful when class loading issues happen."
      "Beware that it may break plugins relying on illegal access."
    ]
    isolate-adventure-from-modloader.comment = [
      "Prevent plugins from loading Kyori Adventure from ModLoader."
      "This is only an compatibility option and persists for now. Will be replaced with a better mechanism."
    ]
  }
  machines {
    owner-events.comment = [
      "Fusion Core: a machine of a mod (a block entity or entity whose type is not minecraft:) that breaks or places blocks without a player"
      "  fires BlockBreakEvent/BlockPlaceEvent as a fake player with the UUID and name of the player who placed the machine,"
      "  so protection plugins treat the machine like its owner"
    ]
    unknown-owner.comment = [
      "For machines with no recorded owner (placed before this feature, or by commands): "
      "  allow - no event, as before; deny - they may not change other blocks; mod - events as the fake player [<modid>]"
    ]
    ignored-mods.comment = [
      "Mod ids whose machines never fire these events, e.g. [\"sable\", \"simulated\", \"aeronautics\"]"
      "  (\"examplemod\" is only a sample entry and matches nothing)"
    ]
  }
  velocity {
    enable.comment = [
      "Enable Velocity modern player info forwarding"
    ]
    secret.comment = [
      "The secret used in Velocity modern player info forwarding"
    ]
  }
  spam-limiter {
    comment = "Fusion Core: Paper's spam-limiter for command suggestions (Tab), Paper's defaults."
    tab-spam-increment.comment = "Added to a player's counter for every suggestion request; the counter drops by 1 every tick."
    tab-spam-limit.comment = "A player (not an operator) whose counter goes above this is kicked for spamming."
    tab-complete-max-pending.comment = [
      "When a plugin listens to AsyncTabCompleteEvent, at most this many requests of one player wait for it;"
      "  further ones get no suggestions until those are answered."
    ]
  }
  tpsbar {
    comment = "Fusion Core: Purpur's /tpsbar, a boss bar with TPS, MSPT and ping (permission purpur.command.tpsbar, operators)."
    enabled.comment = "false - no /tpsbar command (a plugin may provide its own)."
    tick-interval.comment = "Ticks between updates of the bars; TPS and MSPT are the values /tps shows (Paper's getTPS / getAverageTickTime)."
    title.comment = "MiniMessage text of the bar; placeholders <tps> <mspt> <ping>, each colored by text-color."
    overlay.comment = "PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12 or NOTCHED_20."
    fill-mode.comment = "What fills the bar and picks its color: MSPT (of 50), TPS (of 20) or PING (of ping-medium)."
    progress-color.comment = "Bar color per level: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE."
    text-color.comment = "MiniMessage around a value per level; <text> is the value."
    thresholds.comment = [
      "Levels: TPS at least tps-good is good, at least tps-medium medium; MSPT below mspt-good good, below mspt-medium"
      "  medium; ping below ping-good good, below ping-medium medium; anything else low."
    ]
  }
  experimental {
    comment = [
      "These are experimental settings that may improve your compatibility or functionality."
      "Please report the problems you encounter if you decide to use these."
    ]
    replaceable-base-world-generator.comment = [
      "This is here to provide compatibility with TerraBlender in Bukkit created worlds."
      "However, you can also use it to provide more options for Bukkit's multi world support."
      "It's not recommended to create dimensions specific to a mod. This may not be supported."
      "In Bukkit, chunk generators can optionally depend on the original Vanilla chunk generator,"
      "while biome providers completely override the Vanilla biome source."
      "In case you want to use already loaded worldgen config (LevelStem) as the base,"
      "use CUSTOM as the Environment, which instructs Fusion Core to use 'bukkit:<name>' as the level stem."
      "The worldgen options can be provided by a datapack."
      "Using CUSTOM will bypass the worldgen options specified by the world."
      "This will also bypass the WorldType setting. The one that can be specified with -t when using mv create."
      "If you really need it, make or use a data pack that provides the desired worldgen options."
      "Setting this for a already generated world may lead to tearing."
    ]
  }
  lootables {
    comment = [
      "Paper's replenishable lootables (its 'lootables' world settings), the same for every world."
      "Durations are a number followed by s, m, h or d, e.g. 12h."
    ]
    auto-replenish.comment = [
      "Refill loot containers (structure chests, barrels, minecarts, chest boats) with fresh loot some time after they were looted."
    ]
    restrict-player-reloot.comment = [
      "A player who already looted a container does not trigger its refill."
    ]
    restrict-player-reloot-time.comment = [
      "How long restrict-player-reloot holds for one player; \"disabled\" means forever."
    ]
    reset-seed-on-fill.comment = [
      "Pick a new random seed on every fill, so refills differ."
    ]
    max-refills.comment = [
      "How many times a container can be refilled; -1 means no limit."
    ]
    refresh-min.comment = [
      "Shortest time between a fill and the next refill."
    ]
    refresh-max.comment = [
      "Longest time between a fill and the next refill."
    ]
    retain-unlooted-shulker-box-loot-table-on-non-player-break.comment = [
      "A never opened shulker box with a loot table, broken by something other than a player, keeps its loot table in the dropped item."
    ]
  }
  world {
    comment = [
      "Paper's world settings (config/paper-world-defaults.yml) that the core carries out; worlds - own values for one world."
      "Keys and defaults are Paper's; copy the values from a Paper/Purpur/Leaf server to get the same behaviour."
    ]
    chunks {
      entity-per-chunk-save-limit.comment = [
        "The most entities of a type one chunk saves and loads; the rest are dropped. -1 means no limit."
        "Keys are entity ids (\"arrow\", \"minecraft:arrow\", modded ids too)."
      ]
      prevent-moving-into-unloaded-chunks.comment = [
        "Players (and the vehicles they steer) cannot move into chunks that are not loaded; they are put back where they were."
      ]
      max-auto-save-chunks-per-tick.comment = [
        "The autosave saves at most this many chunks per tick instead of all loaded chunks in one tick (no lag spike every"
        "  autosave). /save-all and stopping the server still save everything at once. 0 - all at once, as vanilla."
      ]
    }
    collisions {
      max-entity-collisions.comment = [
        "An entity pushes and is pushed at most this many times per tick; crowds of mobs cost much less. 0 turns pushing off."
      ]
    }
    hopper {
      ignore-occluding-blocks.comment = [
        "Hoppers do not look for minecarts or boats with chests inside full (occluding) blocks."
      ]
    }
    tick-rates {
      comment = "1 is vanilla. A rate of N runs the thing every N ticks."
      grass-spread.comment = "Random ticks of grass (spreading and dying) run every N ticks; below 1 never."
      container-update.comment = "An open menu sends its changes to the player every N ticks."
      mob-spawner.comment = "Spawners run every N ticks and count their delay down by N; -1 stops spawners."
      wet-farmland.comment = "Random ticks of wet farmland run every N ticks; below 1 never."
      dry-farmland.comment = "Random ticks of dry farmland run every N ticks; below 1 never."
      sensor.comment = [
        "Ticks between scans of a sensor: entity id -> sensor class name in lower case -> ticks."
      ]
      behavior.comment = [
        "Ticks a behavior waits after it ended before it may start again: entity id -> behavior class name in lower case -> ticks; -1 is vanilla."
      ]
    }
    feature-seeds {
      generate-random-seeds-for-all.comment = [
        "Give every configured feature (ores, trees, lakes..., modded ones too) of every world its own random seed, so seed"
        "  crackers cannot tell where ores are. Only new chunks change. The seeds are kept in fusioncore-feature-seeds.json in"
        "  the world folder (dimension -> feature id -> seed); seeds written there by hand are used even when this is false."
      ]
    }
    unsupported-settings {
      allow-headless-pistons.comment = [
        "Paper: false - an explosion that destroys a moving piston also destroys the piston it came from, so no headless"
        "  pistons are left (they are used for bedrock breaking). true - vanilla."
      ]
    }
    armorstand {
      place-with-arms-visible.comment = "Purpur: armor stands are placed with their arms shown."
      tick.comment = [
        "Paper: false - armor stands do not tick (no gravity, falling, fire, pushing; poses and equipment still update)."
        "  A stand's own setting (setCanTick, saved as Paper.CanTickOverride) wins. For decorative stands only."
      ]
      minecart-collision-lookups.comment = "Paper (minecart part): false - armor stands do not look for minecarts to push each tick."
    }
    maps {
      item-frame-cursor-update-interval.comment = [
        "Paper: ticks between map updates (picture and cursors) sent for a map in an item frame. 10 is vanilla; more is"
        "  cheaper with many framed maps but slower to update; 0 or less - framed maps are not updated."
      ]
    }
    idle-timeout {
      comment = [
        "Purpur's AFK: a player idle for longer than player-idle-timeout (server.properties, minutes; 0 - never) becomes AFK."
        "  Any action, or moving to another block or turning, ends it."
      ]
      kick-if-idle.comment = "true - kick the idle player, as vanilla (not with the permission purpur.bypassIdleKick); false - only mark AFK."
      tick-nearby-entities.comment = "false - an AFK player does not keep the entities around it active (entity activation range)."
      mobs-target.comment = "false - mobs do not target AFK players."
    }
    worlds.comment = [
      "Settings for one world by its name (world, world_nether, world_the_end; DIM-1 and DIM1 for a vanilla layout); any key can be"
      "  given, the rest comes from above (maps such as entity-per-chunk-save-limit are merged). Paper keeps these in"
      "  world*/paper-world.yml. unsupported-settings is global on Paper and is read here per world too."
    ]
  }
  anti-xray {
    comment = [
      "Fusion Core: Paper's Anti-Xray (anticheat.anti-xray in paper-world-defaults.yml), same keys and defaults."
      "  Ores and other hidden blocks that touch no air are sent to players as stone (engine-mode 1) or mixed with fake ores"
      "  (engine-mode 2 and 3); blocks are revealed when a neighbour is broken or dug at. Modded block ids work too."
    ]
    engine-mode.comment = "1 - hide: hidden blocks look like stone/deepslate/netherrack/end stone; 2 - every replacement block may show as any hidden block; 3 - like 2, one random block per layer."
    max-block-height.comment = "Blocks above this height are sent as they are (rounded down to a multiple of 16)."
    update-radius.comment = "How far from a broken or dug block hidden blocks are revealed (1 or 2)."
    lava-obscures.comment = "Treat still lava as a solid block that hides ores."
    use-permission.comment = "Players with the permission paper.antixray.bypass see the real blocks."
    hidden-blocks.comment = "Blocks to hide (mode 1) or to show as fakes (modes 2 and 3)."
    replacement-blocks.comment = "Modes 2 and 3: blocks that may be replaced with fake hidden blocks."
    worlds.comment = [
      "Settings for one world by its name (world, world_nether, world_the_end; DIM-1 and DIM1 for a vanilla layout); any key above,"
      "  the rest comes from above. Paper keeps these in world*/paper-world.yml."
    ]
  }
}
